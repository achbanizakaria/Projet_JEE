<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: tete('Modifier un joueur')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/base :: navigation}"></nav>
<div class="container" style="max-width: 520px;">
    <h1 class="h4 mb-3">Modifier <span th:text="${joueurCible.prenom} + ' ' + ${joueurCible.nom}">Prénom Nom</span></h1>
    <form th:action="@{/joueur/equipe/joueurs/{id}/modifier(id=${joueurCible.id})}" th:object="${modificationForm}"
          method="post" class="card card-body">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <label for="poste" class="form-label">Poste</label>
        <input type="text" id="poste" th:field="*{poste}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('poste')}" th:errors="*{poste}"></div>

        <label for="numeroMaillot" class="form-label mt-2">Numéro de maillot (1 à 99)</label>
        <input type="number" id="numeroMaillot" th:field="*{numeroMaillot}" class="form-control" min="1" max="99">
        <div class="text-danger" th:if="${#fields.hasErrors('numeroMaillot')}" th:errors="*{numeroMaillot}"></div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-link" th:href="@{/joueur/equipe}">Annuler</a>
        </div>
    </form>
</div>
</body>
</html>
