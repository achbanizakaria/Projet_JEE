<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: tete('Modifier un club')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/base :: navigation}"></nav>
<div class="container" style="max-width: 520px;">
    <div th:replace="~{fragments/base :: messages}"></div>
    <h1 class="h4 mb-3">Modifier le club</h1>
    <form th:action="@{/organisateur/clubs/{id}/modifier(id=${clubId})}" th:object="${clubForm}" method="post" class="card card-body">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" th:field="*{nom}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        <label for="logo" class="form-label mt-2">Logo (chemin ou adresse, facultatif)</label>
        <input type="text" id="logo" th:field="*{logo}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('logo')}" th:errors="*{logo}"></div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-link" th:href="@{/organisateur/clubs}">Annuler</a>
        </div>
    </form>
</div>
</body>
</html>
