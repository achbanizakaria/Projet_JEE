<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: tete('Inscription')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 460px;">
    <h1 class="h4 mt-5 mb-4 text-center">Créer un compte joueur</h1>

    <form th:action="@{/inscription}" th:object="${inscriptionForm}" method="post" class="card card-body">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" th:field="*{nom}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>

        <label for="prenom" class="form-label mt-2">Prénom</label>
        <input type="text" id="prenom" th:field="*{prenom}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>

        <label for="email" class="form-label mt-2">Adresse e-mail</label>
        <input type="email" id="email" th:field="*{email}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="motDePasse" class="form-label mt-2">Mot de passe (8 caractères minimum)</label>
        <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
        <label for="confirmationMotDePasse" class="form-label mt-2">Confirmer le mot de passe</label>
        <input type="password" id="confirmationMotDePasse" th:field="*{confirmationMotDePasse}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('confirmationMotDePasse')}" th:errors="*{confirmationMotDePasse}"></div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Créer mon compte</button>
    </form>
    <p class="text-center mt-3"><a th:href="@{/connexion}">Déjà inscrit ? Se connecter</a></p>
</div>
</body>
</html>
