<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: tete('Accueil')}"></head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 640px;">
    <div class="card card-body">
        <h1 class="h4">Bienvenue, <span th:text="${nom}">Prénom Nom</span></h1>
        <p class="mb-1">Vos rôles :</p>
        <ul>
            <li th:each="r : ${roles}" th:text="${r}">ROLE_JOUEUR</li>
        </ul>
        <form th:action="@{/deconnexion}" method="post">
            <button type="submit" class="btn btn-outline-secondary">Se déconnecter</button>
        </form>
    </div>
</div>
</body>
</html>
