<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="tete(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' – Gestion de tournois'">Gestion de tournois</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Barre de navigation : le menu dépend du rôle. Ajouter ici les liens des futures pages. -->
<nav th:fragment="navigation" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tournois</a>
        <ul class="navbar-nav me-auto" th:if="${utilisateur != null and utilisateur.organisateur}">
            <li class="nav-item"><a class="nav-link" th:href="@{/organisateur/clubs}">Clubs</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/organisateur/tournois}">Mes tournois</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/consultation/tournois}">Calendrier et classements</a></li>
        </ul>
        <ul class="navbar-nav me-auto" th:if="${utilisateur != null and !utilisateur.organisateur}">
            <li class="nav-item"><a class="nav-link" th:href="@{/joueur/equipe}">Mon équipe</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/joueur/matchs}">Mes matchs</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/joueur/tournois}">Inscriptions</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/consultation/tournois}">Calendrier et classements</a></li>
        </ul>
        <ul class="navbar-nav me-auto" th:if="${utilisateur == null}"></ul>
        <span class="navbar-text me-3" th:if="${utilisateur != null}" th:text="${utilisateur.nomComplet}">Prénom Nom</span>
        <a class="nav-link text-white me-3" th:if="${utilisateur != null}" th:href="@{/mot-de-passe}">Mot de passe</a>
        <form th:if="${utilisateur != null}" th:action="@{/deconnexion}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-light">Se déconnecter</button>
        </form>
    </div>
</nav>

<!-- Messages affichés après une action (flash) : succès en vert, erreur en rouge -->
<div th:fragment="messages">
    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
    <div class="alert alert-warning" th:if="${avertissement}" th:text="${avertissement}"></div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>
</div>

</body>
</html>
