<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: tete('Mot de passe')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 460px;">
    <h1 class="h4 mt-5 mb-3 text-center">Changer mon mot de passe</h1>
    <p class="text-muted text-center">Si votre capitaine vous a donné un mot de passe temporaire, remplacez-le avant de continuer.</p>

    <form th:action="@{/mot-de-passe}" th:object="${motDePasseForm}" method="post" class="card card-body">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>

        <label for="ancienMotDePasse" class="form-label">Mot de passe actuel</label>
        <input type="password" id="ancienMotDePasse" th:field="*{ancienMotDePasse}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('ancienMotDePasse')}" th:errors="*{ancienMotDePasse}"></div>

        <label for="nouveauMotDePasse" class="form-label mt-2">Nouveau mot de passe (8 caractères minimum)</label>
        <input type="password" id="nouveauMotDePasse" th:field="*{nouveauMotDePasse}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('nouveauMotDePasse')}" th:errors="*{nouveauMotDePasse}"></div>
        <label for="confirmationNouveauMotDePasse" class="form-label mt-2">Confirmer le nouveau mot de passe</label>
        <input type="password" id="confirmationNouveauMotDePasse" th:field="*{confirmationNouveauMotDePasse}" class="form-control">
        <div class="text-danger mb-2" th:if="${#fields.hasErrors('confirmationNouveauMotDePasse')}" th:errors="*{confirmationNouveauMotDePasse}"></div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Enregistrer</button>
    </form>
</div>
</body>
</html>
